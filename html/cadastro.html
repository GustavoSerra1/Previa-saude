<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro manual de pacientes.">
    <title>Novo cadastro | Prévia Saúde</title>
</head>
<body>
    <header>
        <h1>Prévia Saúde</h1>
        <nav aria-label="Navegação da equipe">
            <a href="index.html">Início</a>
            <a href="painel.html">Painel</a>
            <a href="cadastro.html">Novo cadastro</a>
        </nav>
    </header>
    <main>
        <h2>Novo cadastro</h2>
        <section>
            <form>
                <fieldset>
                    <legend>Cadastro de paciente</legend>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome do paciente" required>
                    <label for="data-nascimento">Data de nascimento:</label>
                    <input type="date" id="data-nascimento" name="data-nascimento" required>
                    <label for="identificação">Número de identificação:</label>
                    <input type="text" id="identificação" name="id" placeholder="Digite o número de identificação do paciente" required>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Digite o telefone do paciente" required>
                </fieldset>
                <button type="submit">Cadastrar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Prévia Saúde — Projeto acadêmico demonstrativo.</p>
        <a href="painel.html">Voltar ao painel</a>
    </footer>
</body>
</html>
